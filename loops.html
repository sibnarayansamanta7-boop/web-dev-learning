<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops Breaks and Continues</title>
    <script>
        //break in for loop
        for (let index = 0; index < 10; index++) {
            if (index === 5) {
                break;
            }
            console.log(index);
        }
        //continue in while loop
        let i = 0;
        while (i < 7) {


            if (i === 2) {
                i++
                continue;
            }
            console.log(i);
            i++;
        }
    </script>
</head>

<body>
    <h1>Loops, Breaks, and Continues</h1>
    <p>This document covers the concepts of loops, breaks, and continues in programming.</p>
</body>

</html>
